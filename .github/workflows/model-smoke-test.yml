name: Model smoke test

# Runs the real Qwen3-0.6B model on the provided prompt set. This is slow and
# downloads ~1.5 GB, so it is triggered manually instead of on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Generate and validate function calls
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.10

      - name: Install the project and dev dependencies
        run: uv sync --frozen

      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Qwen3-0.6B

      - name: Run the model on the provided prompt set
        run: |
          uv run python -m src \
            --input data/input/function_calling_tests.json \
            --output smoke_results.json

      - name: Validate the generated function calls
        run: uv run python scripts/verify_results.py smoke_results.json

      - name: Upload the generated results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke_results.json
